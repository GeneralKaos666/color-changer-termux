name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A tag that does not match Cargo.toml would publish binaries reporting
      # the wrong version, so refuse to build at all.
      - run: sh scripts/check-release-version.sh "$GITHUB_REF_NAME"
      - run: cargo test --locked

  android:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-system-path: true
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - run: cargo ndk -t arm64-v8a -t armeabi-v7a --platform 24 build --release --locked
      - name: Strip and checksum
        env:
          NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          strip="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          cp target/aarch64-linux-android/release/termux-settings termux-settings-aarch64-linux-android
          cp target/armv7-linux-androideabi/release/termux-settings termux-settings-armv7-linux-androideabi
          "$strip" termux-settings-aarch64-linux-android termux-settings-armv7-linux-androideabi
          sha256sum termux-settings-aarch64-linux-android > termux-settings-aarch64-linux-android.sha256
          sha256sum termux-settings-armv7-linux-androideabi > termux-settings-armv7-linux-androideabi.sha256
      # Best effort: a missing attestation should not block a release that has
      # already validated and built cleanly.
      - uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: |
            termux-settings-aarch64-linux-android
            termux-settings-armv7-linux-androideabi
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            termux-settings-aarch64-linux-android
            termux-settings-aarch64-linux-android.sha256
            termux-settings-armv7-linux-androideabi
            termux-settings-armv7-linux-androideabi.sha256
          generate_release_notes: true
