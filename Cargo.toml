[package]
name = "termux-colors"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[lib]
name = "termux_colors"

[[bin]]
name = "termux-colors"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tui-input = "0.11"
time = { version = "0.3", features = ["formatting", "local-offset"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
