[package]
name = "termux-settings"
version = "1.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[lib]
name = "termux_settings"

[[bin]]
name = "termux-settings"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tui-input = "0.11"
time = { version = "0.3", features = ["formatting", "local-offset"] }
ttf-parser = "0.25"
ureq = { version = "2.10", features = ["tls"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
