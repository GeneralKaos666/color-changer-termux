[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "termux-colors"
version = "0.1.0"
description = "A Textual TUI to change Termux terminal colors and app theme"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["textual>=0.60"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
termux-colors = "termux_colors.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
